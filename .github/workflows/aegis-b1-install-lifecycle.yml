name: Aegis B1 Governed Installation Contract

on:
  pull_request:
    paths:
      - 'src/sofia/platform/ops/platform_installation.py'
      - 'src/sofia/platform/ops/__init__.py'
      - 'src/sofia/platform/safe/**'
      - 'test/test_ops_platform_installation.py'
      - '.github/workflows/aegis-b1-install-lifecycle.yml'
  push:
    branches: [main]
    paths:
      - 'src/sofia/platform/ops/platform_installation.py'
      - 'test/test_ops_platform_installation.py'
      - '.github/workflows/aegis-b1-install-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governed-installation:
    name: B1 exact-head tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install isolated test harness
        run: python -m pip install -e . pytest
      - name: Compile actual B1 source and regression tests
        run: python -m compileall -q src/sofia/platform/ops/platform_installation.py test/test_ops_platform_installation.py
      - name: Exercise signed staging, activation, rollback and crash denial
        env:
          SOFIA_STATE_ROOT: ${{ runner.temp }}/aegis-b1-isolated-state
        run: python -m pytest -q test/test_ops_platform_installation.py --junitxml=b1-installation-junit.xml
      - name: Upload bounded exact-source test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: b1-installation-${{ matrix.os }}-${{ github.sha }}
          path: b1-installation-junit.xml
          if-no-files-found: warn
