name: Aegis Debian12 Offline VM Service Contract

on:
  pull_request:
    paths:
      - 'Cargo.*'
      - 'rust/**'
      - 'src/sofia/platform/**'
      - 'src/sofia/sdk/**'
      - 'packaging/**'
      - 'tools/aegis_debian_vm.py'
      - 'test/fixtures/aegis_debian_vm/**'
      - 'test/test_aegis_debian_vm_runner.py'
      - 'test/conftest.py'
      - '.github/workflows/aegis-debian12-vm.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegis-debian-vm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact PR HEAD before tests
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Wrong checked-out source SHA" >&2
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - run: python -m pip install -e . pytest
      - name: Verify VM orchestration and evidence boundaries
        env:
          SOFIA_STATE_ROOT: ${{ runner.temp }}/aegis-vm-harness-state
        run: python -m pytest -q test/test_aegis_debian_vm_runner.py test/test_ops_signed_vm_release.py test/test_package_grouping.py
      - name: Compile on Debian12 and verify two actual offline systemd boots
        env:
          SOFIA_STATE_ROOT: ${{ runner.temp }}/aegis-vm-harness-state
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.aegis_debian_vm --checkout "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/aegis-debian12-vm" \
            --toolchain "$(rustc --print sysroot)" --disposable-vm
      - name: Upload public conformance receipts only
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: debian12-offline-vm-${{ github.sha }}
          path: |
            ${{ runner.temp }}/aegis-debian12-vm/summary.json
            ${{ runner.temp }}/aegis-debian12-vm/inputs.json
            ${{ runner.temp }}/aegis-debian12-vm/built-artifacts.json
            ${{ runner.temp }}/aegis-debian12-vm/receipt-*.json
            ${{ runner.temp }}/aegis-debian12-vm/boot-*.log
            ${{ runner.temp }}/aegis-debian12-vm/build-and-boot.log
