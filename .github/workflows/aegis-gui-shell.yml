name: Aegis Windows GUI Shell Preflight

on:
  pull_request:
    paths:
      - "packaging/ui/Start-AegisControlCenter.ps1"
      - "test/test_ui_aegis_gui_shell.py"
      - "contracts/ui/aegis-theme-v1.json"
      - ".github/workflows/aegis-gui-shell.yml"
  push:
    branches: [main]
    paths:
      - "packaging/ui/Start-AegisControlCenter.ps1"
      - "test/test_ui_aegis_gui_shell.py"
      - ".github/workflows/aegis-gui-shell.yml"

permissions:
  contents: read

jobs:
  gui-shell:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install read-only UI test harness
        run: python -m pip install -e . pytest
      - name: Verify GUI theme, authority separation and Windows PowerShell preflight
        run: python -m pytest -q test/test_ui_aegis_gui_shell.py
