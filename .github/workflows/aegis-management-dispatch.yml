name: Aegis Authenticated Management Read Dispatch

on:
  pull_request:
    paths:
      - "src/sofia/platform/application/platform_management_read.py"
      - "test/test_ops_platform_management_dispatch.py"
      - ".github/workflows/aegis-management-dispatch.yml"
  push:
    branches: [main]
    paths:
      - "src/sofia/platform/application/platform_management_read.py"
      - "test/test_ops_platform_management_dispatch.py"
      - ".github/workflows/aegis-management-dispatch.yml"

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install isolated package test harness
        run: python -m pip install -e . pytest
      - name: Test current peer authorization, revocation and bounded response
        run: python -m pytest -q test/test_ops_platform_management_dispatch.py
