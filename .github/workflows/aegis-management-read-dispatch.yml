name: Aegis Authenticated Management Read Dispatch

on:
  pull_request:
    paths:
      - "src/sofia/platform/run/management_read.py"
      - "src/sofia/sdk/platform_management.py"
      - "test/test_run_management_read_dispatch.py"
      - ".github/workflows/aegis-management-read-dispatch.yml"
  push:
    branches: [main]
    paths:
      - "src/sofia/platform/run/management_read.py"
      - "test/test_run_management_read_dispatch.py"
      - ".github/workflows/aegis-management-read-dispatch.yml"

permissions:
  contents: read

jobs:
  dispatch-contract:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install bounded test harness
        run: python -m pip install -e . pytest
      - name: Check current permission, STOP and midflight revocation denial
        run: python -m pytest -q test/test_run_management_read_dispatch.py test/test_ui_platform_management_read.py
