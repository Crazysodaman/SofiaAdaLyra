name: Aegis Platform Management Read Authority

on:
  pull_request:
    paths:
      - "src/sofia/platform/application/management_read_service.py"
      - "src/sofia/sdk/platform_management.py"
      - "test/test_ops_management_read_dispatch.py"
      - ".github/workflows/aegis-management-read.yml"
  push:
    branches: [main]
    paths:
      - "src/sofia/platform/application/management_read_service.py"
      - "test/test_ops_management_read_dispatch.py"
      - ".github/workflows/aegis-management-read.yml"

permissions:
  contents: read

jobs:
  read-authority:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install component test harness
        run: python -m pip install -e . pytest
      - name: Compile strict management and authority modules
        run: python -m compileall -q src/sofia/sdk/platform_management.py src/sofia/platform/application/management_read_service.py
      - name: Verify authorization, STOP, revocation and generation fences
        run: python -m pytest -q test/test_ops_management_read_dispatch.py test/test_ui_platform_management_read.py
