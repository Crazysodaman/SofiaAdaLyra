name: Aegis Native Windows GUI Shell

on:
  pull_request:
    paths:
      - 'packaging/ui/Start-AegisControlCenter.ps1'
      - 'test/test_ui_aegis_gui_shell.py'
      - '.github/workflows/aegis-native-gui-shell.yml'
  push:
    branches: [main]
    paths:
      - 'packaging/ui/Start-AegisControlCenter.ps1'
      - 'test/test_ui_aegis_gui_shell.py'
      - '.github/workflows/aegis-native-gui-shell.yml'

permissions:
  contents: read

jobs:
  windows-gui:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install test harness
        run: python -m pip install -e . pytest
      - name: Verify read-only GUI preflight and contract
        run: python -m pytest -q test/test_ui_aegis_gui_shell.py
      - name: Parse Windows PowerShell GUI script
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './packaging/ui/Start-AegisControlCenter.ps1').Path,
            [ref]$tokens, [ref]$parseErrors
          )
          if (@($parseErrors).Count -gt 0) { throw 'GUI parse failed' }
