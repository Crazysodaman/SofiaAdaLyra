name: Aegis Platform-only Development Gate

on:
  pull_request:
    paths:
      - 'src/sofia/platform/**'
      - 'src/sofia/sdk/**'
      - 'packaging/**'
      - 'rust/**'
      - 'Cargo.*'
      - 'test/**'
      - '.github/workflows/aegis-platform-only.yml'
      - '.github/actions/platform-only-checks/**'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact PR HEAD before tests
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Wrong checked-out source SHA" >&2
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: ./.github/actions/platform-only-checks

  debian12:
    runs-on: ubuntu-24.04
    container: python:3.12-slim-bookworm
    timeout-minutes: 40
    steps:
      - name: Prepare disposable Debian 12 test container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential
          python -m venv /tmp/aegis-gate
          echo /tmp/aegis-gate/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact PR HEAD before tests
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          # Container checkout may be owned by the host runner UID.
          # Trust only this exact runner workspace, never a wildcard.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Wrong checked-out source SHA" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: ./.github/actions/platform-only-checks
