name: Aegis Portainer Stack Read Reconciliation

on:
  pull_request:
    paths:
      - 'src/sofia/modules/integrations/portainer.py'
      - 'src/sofia/modules/integrations/portainer_projection.py'
      - 'src/sofia/modules/integrations/capabilities.py'
      - 'src/sofia/platform/safe/permissions.py'
      - 'test/test_portainer_projection.py'
      - 'test/test_portainer_stack_readonly.py'
      - 'test/test_portainer_reconciled_safety.py'
      - 'test/test_tools_completion_acceptance.py'
      - 'test/conftest.py'
      - '.github/workflows/aegis-portainer-reconciliation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    name: Redaction and denied dispatch
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: \${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install -e . pytest
      - name: Check dependencies
        run: python -m pip check
      - name: Compile redaction and tests
        run: python -m compileall -q src/sofia/modules/integrations test/test_portainer_reconciled_safety.py
      - name: Check read-only bounded scopes, exact endpoint IDs and capabilities
        run: >-
          python -m pytest -q
          test/test_portainer_projection.py
          test/test_portainer_stack_readonly.py
          test/test_portainer_reconciled_safety.py
          test/test_tools_completion_acceptance.py
          test/test_package_grouping.py
