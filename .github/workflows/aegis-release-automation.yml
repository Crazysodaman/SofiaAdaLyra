            test/test_ops_platform_row_preflight.py \
            test/test_platform_release_verifier.py \
            test/test_ops_platform_release_staging.py \
            test/test_ops_platform_installer_bundle.py

      - name: Exercise the simulated-only four-host harness without signing keys
        shell: bash
        run: |
          set -euo pipefail
