name: Aegis Remote Fleet Naming Proof

on:
  pull_request:
    paths:
      - 'src/sofia/platform/ops/callsign_remote.py'
      - 'src/sofia/platform/ops/callsigns.py'
      - 'test/test_callsign_remote.py'
      - 'test/test_fleet_callsigns.py'
      - 'test/test_package_grouping.py'
      - '.github/workflows/aegis-remote-naming-proof.yml'
  push:
    branches: [main]
    paths:
      - 'src/sofia/platform/ops/callsign_remote.py'
      - 'src/sofia/platform/ops/callsigns.py'
      - 'test/test_callsign_remote.py'
      - '.github/workflows/aegis-remote-naming-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    name: Signed read proof
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and test dependencies
        run: python -m pip install -e . pytest
      - name: Confirm environment
        run: python -m pip check
      - name: Compile remote naming proof
        run: python -m compileall -q src/sofia/platform/ops/callsign_remote.py test/test_callsign_remote.py
      - name: Verify pinned authority proof, offline refusal and test ownership
        run: python -m pytest -q test/test_callsign_remote.py test/test_fleet_callsigns.py test/test_package_grouping.py
