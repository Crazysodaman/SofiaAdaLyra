name: Aegis Settings Read-only UI Contract

on:
  pull_request:
    paths:
      - "src/sofia/sdk/platform_settings_view.py"
      - "test/test_ui_platform_settings_view.py"
      - ".github/workflows/aegis-settings-view.yml"
  push:
    branches: [main]
    paths:
      - "src/sofia/sdk/platform_settings_view.py"
      - "test/test_ui_platform_settings_view.py"
      - ".github/workflows/aegis-settings-view.yml"

permissions:
  contents: read

jobs:
  settings-view:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install UI test harness
        run: python -m pip install -e . pytest
      - name: Verify redaction, revision and stale apply claims
        run: python -m pytest -q test/test_ui_platform_settings_view.py
