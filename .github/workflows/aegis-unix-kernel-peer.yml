name: Aegis Linux Kernel Peer Transport

on:
  pull_request:
    paths:
      - 'src/sofia/platform/run/local_peer.py'
      - 'test/test_run_local_peer_kernel.py'
      - 'test/test_run_management_unix_listener.py'
      - 'src/sofia/platform/run/management_unix_listener.py'
      - 'src/sofia/platform/run/management_read.py'
      - 'test/test_run_management_read_dispatch.py'
      - '.github/workflows/aegis-unix-kernel-peer.yml'
  push:
    branches: [main]
    paths:
      - 'src/sofia/platform/run/local_peer.py'
      - 'test/test_run_local_peer_kernel.py'
      - 'test/test_run_management_unix_listener.py'
      - 'src/sofia/platform/run/management_unix_listener.py'
      - 'src/sofia/platform/run/management_read.py'
      - 'test/test_run_management_read_dispatch.py'
      - '.github/workflows/aegis-unix-kernel-peer.yml'

permissions:
  contents: read

jobs:
  peer-credential-contract:
    name: Kernel peer / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install exact-source test dependencies
        run: python -m pip install -e . pytest
      - name: Test verified kernel peer provenance and bounded response
        run: python -m pytest -q test/test_run_local_peer_kernel.py test/test_run_management_unix_listener.py test/test_run_management_read_dispatch.py
