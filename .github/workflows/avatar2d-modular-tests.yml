name: Avatar2D Modular Puppet Tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/avatar2d-modular-tests.yml"
      - "src/sofia/modules/avatar/vtuber_character_bundle.py"
      - "src/sofia/modules/avatar/vtuber_character_parts.py"
      - "src/sofia/modules/avatar/vtuber_character_selection.py"
      - "src/sofia/modules/ui/avatar2d_renderer.py"
      - "test/test_avatar2d_character_bundle.py"
      - "test/test_ui_avatar2d_modular.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  character-2d:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project and test runner
        shell: pwsh
        run: python -m pip install -e . pytest
      - name: Verify modular PNG loader, outfits and frame receipts
        shell: pwsh
        run: |
          python -m pytest -q test/test_avatar2d_character_bundle.py test/test_ui_avatar2d_modular.py test/test_ui_avatar2d_renderer.py test/test_avatar2d_character_parts.py test/test_avatar2d_character_selection.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile production modules
        shell: pwsh
        run: |
          python -m py_compile src/sofia/modules/avatar/vtuber_character_bundle.py src/sofia/modules/avatar/vtuber_character_selection.py src/sofia/modules/ui/avatar2d_renderer.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
