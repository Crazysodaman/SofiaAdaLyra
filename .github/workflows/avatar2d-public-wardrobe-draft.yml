name: Avatar2D Public Wardrobe Draft PNGs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/avatar2d-public-wardrobe-draft.yml"
      - "src/sofia/avatar/wardrobe_public_sprite_batch.py"
      - "src/sofia/avatar/wardrobe_data/*.json"
      - "test/test_avatar2d_public_sprite_batch.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-public-sprite-batch:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install source and image dependencies
        shell: pwsh
        run: |
          python -m pip install -e . pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test public-only garment inventory and candidate geometry
        shell: pwsh
        run: |
          python -m pytest -q test/test_avatar2d_public_sprite_batch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Render all public PNG draft assets from canonical wardrobe data
        shell: pwsh
        run: |
          python -m sofia.avatar.wardrobe_public_sprite_batch --output "wardrobe-draft"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify output counts and exclude all private files
        shell: pwsh
        run: |
          $meta = Get-Content -LiteralPath "wardrobe-draft/manifest.json" -Raw | ConvertFrom-Json
          if ($meta.count -ne 244 -or $meta.items.Count -ne 244 -or $meta.art_status -ne "DRAFT_VECTOR_NOT_PRODUCTION") { throw "Wrong public draft inventory" }
          $items = @(Get-ChildItem -LiteralPath "wardrobe-draft/items" -Filter "*.png" -File)
          if ($items.Count -ne 244) { throw "Missing public PNG" }
          if (@($meta.items | Where-Object { $_.private_only -ne $false }).Count -gt 0) { throw "PRIVATE image in public pack" }
      - name: Upload separate review-only artifact, never live public root
        uses: actions/upload-artifact@v4
        with:
          name: sofia-public-wardrobe-244-DRAFT-NOT-LIVE
          path: wardrobe-draft/
          if-no-files-found: error
          retention-days: 30
