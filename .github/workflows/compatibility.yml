name: Platform Compatibility

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
        python:
          - "3.12"
          - "3.14"

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install project
        run: python -m pip install -e .

      - name: Run static compatibility gate
        run: >
          python -m sofia.verify.gate
          --phase static
          --evidence-path compatibility-evidence.json

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-${{ matrix.os }}-py${{ matrix.python }}-${{ github.sha }}
          path: compatibility-evidence.json
          if-no-files-found: error
