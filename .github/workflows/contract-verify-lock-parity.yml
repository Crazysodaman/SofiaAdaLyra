name: Contract verification lock and parity

on:
  pull_request:
    paths:
      - "requirements.verify.lock.*.txt"
      - ".github/workflows/manual-verify.yml"
      - ".github/workflows/compatibility.yml"
      - ".github/workflows/package-tests.yml"
      - ".github/workflows/contract-verify-lock-parity.yml"
      - "test/test_sdk_rust_contract_compatibility.py"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: Verified Python lock and SDK parity (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # This lane proves Python lock parity; Rust MSRV is separately checked
    # by dedicated R1/R2 matrix jobs. Avoid Windows rustfmt toolchain collision.
    env:
      RUSTUP_TOOLCHAIN: stable
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.13"
            runtime: requirements.lock.linux-py313.txt
            verify: requirements.verify.lock.linux-py313.txt
          - os: windows-latest
            python: "3.12"
            runtime: requirements.lock.windows-py312.txt
            verify: requirements.verify.lock.windows-py312.txt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install immutable runtime and verification wheels
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r "${{ matrix.runtime }}"
          python -m pip install --require-hashes --only-binary=:all: -r "${{ matrix.verify }}"
          python -m pip install -e . --no-deps
          python -m pip check
      - name: Build actual Rust contract oracle
        run: cargo build --locked -p sofia-contracts --bin sofia-contract-tool
      - name: Validate full SDK contract fixture corpus
        run: python -m pytest -q test/test_sdk_rust_contract_compatibility.py
