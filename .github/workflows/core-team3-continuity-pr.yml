name: CORE-003 Disposable Continuity CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'test/test_core_team3_disposable_continuity.py'
      - 'test/test_core_team3_legacy_policy_v1.py'
      - 'test/test_core_team3_application_v1_hook.py'
      - 'test/core_team3_policy_fixture.py'
      - 'src/sofia/core/memory/eligibility_v1.py'
      - 'src/sofia/core/memory/promoted_retrieval.py'
      - 'src/sofia/core/memory/system.py'
      - 'src/sofia/core/memory/provenance_store.py'
      - 'src/sofia/platform/application/memory_review.py'
      - '.github/workflows/core-team3-continuity-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuity:
    name: t3-disposable (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert source checkout matches exact PR HEAD
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os,subprocess; actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); expected=os.environ['EXPECTED_HEAD_SHA']; print('CORE-003 checkout',actual); assert actual==expected, (actual,expected)"
      - name: Install isolated test dependencies
        run: python -m pip install -e . pytest
      - name: Run synthetic source and whole-application restart contracts
        run: >-
          python -m pytest -q
          test/test_core_team3_disposable_continuity.py
          test/test_core_team3_legacy_policy_v1.py
          test/test_core_team3_application_v1_hook.py
          test/test_application_restart_continuity.py
          test/test_memory_reviewed_corrections.py
          test/test_memory_review_source_revalidation.py
          test/test_state_atomic_file.py
          test/test_memory_deletion_restore.py
