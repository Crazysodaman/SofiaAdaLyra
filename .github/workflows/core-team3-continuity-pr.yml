name: CORE-003 Disposable Continuity CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'test/test_core_team3_disposable_continuity.py'
      - '.github/workflows/core-team3-continuity-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuity:
    name: t3-disposable (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install -e . pytest
      - name: Run only synthetic Team 3 restart contracts
        run: python -m pytest -q test/test_core_team3_disposable_continuity.py
