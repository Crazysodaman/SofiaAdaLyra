name: CORE-001 Runtime Lifecycle Regression

on:
  pull_request:
    paths:
      - "src/sofia/platform/run/release_process.py"
      - "src/sofia/platform/run/runtime_child.py"
      - "src/sofia/platform/run/runtime_service.py"
      - "src/sofia/platform/run/runtime_authority.py"
      - "src/sofia/platform/run/host.py"
      - "test/test_run_release_process.py"
      - "test/test_run_runtime_child.py"
      - "test/test_run_runtime_authority.py"
      - "test/test_run_host.py"
      - ".github/workflows/core001-lifecycle-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-lifecycle:
    name: Core 1 lifecycle / ${{ matrix.os }} / Python 3.12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install full repository and test runner
        run: python -m pip install -e . pytest
      - name: Full-checkout runtime, supervisor, tray and Core-worker regression
        run: >
          python -m pytest -q
          test/test_run_release_process.py
          test/test_run_runtime_child.py
          test/test_run_runtime_authority.py
          test/test_run_host.py
          test/test_run_supervisor.py
          test/test_ui_tray_lifecycle.py
          test/test_core_worker_process.py
