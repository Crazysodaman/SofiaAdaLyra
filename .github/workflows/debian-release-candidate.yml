name: Debian Release Candidate Build

on:
  pull_request:
    paths:
      - 'test/test_platform_optional_dependencies.py'
      - 'test/test_life_procedure_catalog.py'
      - '.github/workflows/release-candidate.yml'
      - '.github/workflows/debian-release-candidate.yml'
      - '.github/workflows/package-tests.yml'
  push:
    branches: [main, chatgpt/go-live-release-env-version, codex/aegis-shakedown]
  workflow_dispatch:
    inputs:
      release_id:
        description: Optional exact release ID
        required: false
        type: string
      parent_release_id:
        description: Previously accepted release ID
        required: false
        type: string
      parent_manifest_sha256:
        description: Previously accepted manifest digest
        required: false
        type: string

concurrency:
  group: debian-release-candidate-${{ github.ref }}
  # Cancel superseded GO LIVE development pushes only. Main release history
  # and explicit release dispatches keep their independent evidence.
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/chatgpt/go-live-release-env-version' }}

jobs:
  build:
    outputs:
      integrated_id: ${{ steps.upload_integrated.outputs.artifact-id }}
      integrated_digest: ${{ steps.upload_integrated.outputs.artifact-digest }}
      components_id: ${{ steps.upload_components.outputs.artifact-id }}
      components_digest: ${{ steps.upload_components.outputs.artifact-digest }}
    runs-on: ubuntu-24.04
    # Full installed-wheel verification may exceed the legacy 40-minute budget.
    # Keep the evidence and verification checks intact, not sharded/waived.
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install exact hashed Debian dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "SOFIA_RELEASE_SOURCE=$RUNNER_TEMP/sofia-debian-release-source" >> "$GITHUB_ENV"
          echo "SOFIA_RELEASE_VENV=$RUNNER_TEMP/sofia-debian-release-venv" >> "$GITHUB_ENV"
          echo "SOFIA_VERIFICATION_EVIDENCE=$RUNNER_TEMP/sofia-debian-verification.json" >> "$GITHUB_ENV"
          python -m venv "$RUNNER_TEMP/sofia-debian-release-venv"
          PY="$RUNNER_TEMP/sofia-debian-release-venv/bin/python"
          "$PY" -m pip install --require-hashes -r requirements.lock.linux-py313.txt
          "$PY" -m pip install --require-hashes -r requirements.verify.lock.linux-py313.txt
          "$PY" -m pip install --require-hashes --only-binary=:all: -r requirements.build.lock.linux-py313.txt

      - name: Materialize byte-identical tracked Git source
        shell: bash
        run: |
          set -euo pipefail
          python src/sofia/platform/verify/stage_release_source.py \
            --checkout "$GITHUB_WORKSPACE" --target "$SOFIA_RELEASE_SOURCE"

      - name: Build two exact-source wheels and require reproducibility
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python - <<'PY'
          import os, pathlib, shutil
          root = pathlib.Path(os.environ["SOFIA_RELEASE_SOURCE"])
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          for name in ("sofia-debian-build-a", "sofia-debian-build-b"):
              shutil.copytree(root, temp / name)
          PY
          PY="$SOFIA_RELEASE_VENV/bin/python"
          mkdir -p "$RUNNER_TEMP/sofia-debian-dist-a" "$RUNNER_TEMP/sofia-debian-dist-b"
          "$PY" -m pip wheel --no-build-isolation --no-deps \
            --wheel-dir "$RUNNER_TEMP/sofia-debian-dist-a" "$RUNNER_TEMP/sofia-debian-build-a"
          "$PY" -m pip wheel --no-build-isolation --no-deps \
            --wheel-dir "$RUNNER_TEMP/sofia-debian-dist-b" "$RUNNER_TEMP/sofia-debian-build-b"
          a="$(find "$RUNNER_TEMP/sofia-debian-dist-a" -maxdepth 1 -type f -name '*.whl' -print)"
          b="$(find "$RUNNER_TEMP/sofia-debian-dist-b" -maxdepth 1 -type f -name '*.whl' -print)"
          test -n "$a" && test -n "$b"
          digest_a="$(sha256sum "$a" | cut -d' ' -f1)"
          digest_b="$(sha256sum "$b" | cut -d' ' -f1)"
          echo "Debian wheel SHA-256: $digest_a"
          test "$digest_a" = "$digest_b"
          echo "SOFIA_RELEASE_WHEEL=$a" >> "$GITHUB_ENV"

      - name: Install exact built wheel into verification venv
        shell: bash
        run: |
          set -euo pipefail
          "$SOFIA_RELEASE_VENV/bin/python" -m pip install \
            --no-index --no-deps --force-reinstall "$SOFIA_RELEASE_WHEEL"
          "$SOFIA_RELEASE_VENV/bin/python" -m pip check

      - name: Run exact revision provenance and verification
        shell: bash
        run: |
          set -euo pipefail
          PY="$SOFIA_RELEASE_VENV/bin/python"
          "$PY" -m sofia.platform.verify.source_provenance \
            --checkout "$GITHUB_WORKSPACE" \
            --archive "$SOFIA_RELEASE_SOURCE" \
            --venv "$SOFIA_RELEASE_VENV" \
            --evidence "$RUNNER_TEMP/sofia-debian-source-provenance.json"
          set +e
          "$PY" -m sofia.platform.verify.gate \
            --phase full --installed-wheel-only \
            --repo "$GITHUB_WORKSPACE" \
            --evidence-path "$SOFIA_VERIFICATION_EVIDENCE" \
            2>&1 | tee "$RUNNER_TEMP/sofia-debian-verification.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "### Debian verification failure tail"
              echo '```text'
              tail -n 200 "$RUNNER_TEMP/sofia-debian-verification.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Upload Debian verification diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debian-verification-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/sofia-debian-verification.log
            ${{ runner.temp }}/sofia-debian-verification.json
            ${{ runner.temp }}/sofia-debian-source-provenance.json
          if-no-files-found: warn

      - name: Construct and verify separated component artifacts
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          PY="$SOFIA_RELEASE_VENV/bin/python"
          APP_VERSION="$("$PY" -c "from sofia.core.package_metadata import application_version; print(application_version())")"
          "$PY" -m sofia.platform.verify.component_artifacts \
            --output "$RUNNER_TEMP/sofia-components" \
            --repo "$GITHUB_WORKSPACE" \
            --version "$APP_VERSION" 2>&1 | tee "$RUNNER_TEMP/sofia-components.log"
          SDK_WHEEL="$(ls "$RUNNER_TEMP/sofia-components/sofia_sdk-"*.whl | head -n1)"
          PLATFORM_WHEEL="$(ls "$RUNNER_TEMP/sofia-components/sofia_platform-"*.whl | head -n1)"
          CORE_WHEEL="$(ls "$RUNNER_TEMP/sofia-components/sofia_core-"*.whl | head -n1)"
          args=(
            -m sofia.platform.dev.release_cli construct
            --git-revision "${{ github.event.pull_request.head.sha || github.sha }}"
            --lock requirements.lock.linux-py313.txt
            --component-wheel "sdk=$SDK_WHEEL"
            --component-wheel "platform=$PLATFORM_WHEEL"
            --component-wheel "core=$CORE_WHEEL"
            --source "$SOFIA_RELEASE_SOURCE"
            --constitution-hash "$SOFIA_RELEASE_SOURCE/src/sofia/core/constitution/constitution.sha256"
            --verification-evidence "$SOFIA_VERIFICATION_EVIDENCE"
            --output release-evidence-components
          )
          if test -n "$RELEASE_ID"; then args+=(--release-id "$RELEASE_ID-components"); fi
          "$PY" "${args[@]}"
          "$PY" -m sofia.platform.dev.release_cli verify --release-dir release-evidence-components

      - name: Upload separated component Linux release evidence (unsigned until approved promotion)
        id: upload_components
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-components-debian-${{ github.event.pull_request.head.sha || github.sha }}
          path: release-evidence-components
          if-no-files-found: error

      - name: Construct and validate immutable Linux release evidence
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          PARENT_RELEASE_ID: ${{ inputs.parent_release_id }}
          PARENT_MANIFEST_SHA256: ${{ inputs.parent_manifest_sha256 }}
        run: |
          set -euo pipefail
          PY="$SOFIA_RELEASE_VENV/bin/python"
          args=(
            -m sofia.platform.dev.release_cli construct
            --git-revision "${{ github.event.pull_request.head.sha || github.sha }}"
            --lock requirements.lock.linux-py313.txt
            --wheel "$SOFIA_RELEASE_WHEEL"
            --source "$SOFIA_RELEASE_SOURCE"
            --constitution-hash "$SOFIA_RELEASE_SOURCE/src/sofia/core/constitution/constitution.sha256"
            --verification-evidence "$SOFIA_VERIFICATION_EVIDENCE"
            --output release-evidence
          )
          if test -n "$RELEASE_ID"; then args+=(--release-id "$RELEASE_ID"); fi
          if test -n "$PARENT_RELEASE_ID" || test -n "$PARENT_MANIFEST_SHA256"; then
            test -n "$PARENT_RELEASE_ID" && test -n "$PARENT_MANIFEST_SHA256"
            args+=(--parent-release-id "$PARENT_RELEASE_ID" --parent-manifest-sha256 "$PARENT_MANIFEST_SHA256")
          fi
          "$PY" "${args[@]}"
          "$PY" -m sofia.platform.dev.release_cli verify --release-dir release-evidence

      - name: Upload Linux release evidence (unsigned until approved promotion)
        id: upload_integrated
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-debian-${{ github.event.pull_request.head.sha || github.sha }}
          path: release-evidence
          if-no-files-found: error

  attest:
    name: Keyless candidate provenance (debian)
    needs: build
    if: >-
      needs.build.result == 'success' &&
      github.repository == 'Crazysodaman/SofiaAdaLyra' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/chatgpt/go-live-release-env-version')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.sha }}
      SOURCE_REF: ${{ github.ref }}
      SOURCE_REPOSITORY: ${{ github.repository }}
      INTEGRATED_DIGEST: ${{ needs.build.outputs.integrated_digest }}
      COMPONENTS_DIGEST: ${{ needs.build.outputs.components_digest }}
    steps:
      - name: Checkout exact verification tooling without installing candidate code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download exact integrated archive with mandatory digest verification
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.integrated_id }}
          path: ${{ runner.temp }}/keyless-subjects/integrated
          skip-decompress: true
          digest-mismatch: error
      - name: Download exact separated archive with mandatory digest verification
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.components_id }}
          path: ${{ runner.temp }}/keyless-subjects/components
          skip-decompress: true
          digest-mismatch: error
      - name: Validate exact source, accepted full gates and immutable upload digests
        shell: bash
        run: |
          set -euo pipefail
          python3 src/sofia/platform/verify/keyless_release.py prepare \
            --integrated-dir "$RUNNER_TEMP/keyless-subjects/integrated" \
            --integrated-digest "$INTEGRATED_DIGEST" \
            --components-dir "$RUNNER_TEMP/keyless-subjects/components" \
            --components-digest "$COMPONENTS_DIGEST" \
            --revision "$SOURCE_SHA" --output "$RUNNER_TEMP/keyless-verification"
      - name: Attest immutable release archives using GitHub OIDC and Sigstore
        id: attest
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-checksums: ${{ runner.temp }}/keyless-verification/subjects.sha256
      - name: Cryptographically verify repository, workflow, source SHA, ref and subjects
        shell: bash
        run: |
          set -euo pipefail
          python3 src/sofia/platform/verify/keyless_release.py verify \
            --index "$RUNNER_TEMP/keyless-verification/subjects.json" \
            --repository "$SOURCE_REPOSITORY" \
            --workflow .github/workflows/debian-release-candidate.yml \
            --source-ref "$SOURCE_REF" --revision "$SOURCE_SHA" \
            --receipt "$RUNNER_TEMP/keyless-verification/verified-attestations.json"
      - name: Upload candidate attestation bundles and verification diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: keyless-release-evidence-debian-${{ github.sha }}
          path: |
            ${{ runner.temp }}/keyless-subjects
            ${{ runner.temp }}/keyless-verification
            ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
