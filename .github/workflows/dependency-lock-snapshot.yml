name: Production Dependency Lock Snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - pyproject.toml
      - src/sofia/dev/dependency_lock.py
      - src/sofia/dev/supply_chain.py
      - .github/workflows/dependency-lock-snapshot.yml

concurrency:
  group: dependency-lock-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve production runtime dependencies
        shell: pwsh
        run: |
          python -m venv .lockvenv
          .\.lockvenv\Scripts\python.exe -m pip install --upgrade pip
          .\.lockvenv\Scripts\python.exe -m pip install .
          .\.lockvenv\Scripts\python.exe -m pip freeze --exclude-editable |
            Where-Object { $_ -notmatch '^sofia-ada-lyra(?:==|\\s+@)' } |
            Sort-Object |
            Set-Content -Encoding utf8 requirements.lock.windows-py312.raw.txt
          .\.lockvenv\Scripts\python.exe -m sofia.dev.dependency_lock requirements.lock.windows-py312.raw.txt requirements.lock.windows-py312.txt
          Get-Content requirements.lock.windows-py312.txt

      - name: Upload resolved lock
        uses: actions/upload-artifact@v4
        with:
          name: requirements-lock-windows-py312-${{ github.sha }}
          path: requirements.lock.windows-py312.txt
          if-no-files-found: error
