name: G0-G1 Release Integrity CI

on:
  push:
    branches:
      - chatgpt/g0-g1-release-integrity
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0g1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: g0g1 (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      SOFIA_STATE_ROOT: ${{ github.workspace }}/state/cloud-runtime
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Isolate runtime state
        shell: bash
        run: |
          mkdir -p "$SOFIA_STATE_ROOT"
          test -w "$SOFIA_STATE_ROOT"
      - name: Install test dependencies
        run: python -m pip install -e . pytest
      - name: Verify imports and dependencies
        run: |
          python -m pip check
          python -m compileall -q src/sofia test
      - name: Run g0g1 regressions
        run: python -m pytest -q test/test_run_active_release.py
