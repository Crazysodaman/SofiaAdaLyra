name: G3 Writer Fencing CI

on:
  push:
    branches:
      - chatgpt/g3-replication-read-fencing
  pull_request:
    paths:
      - 'src/sofia/platform/state/replication.py'
      - 'src/sofia/platform/ops/state_promotion.py'
      - 'test/test_state_replication.py'
      - 'test/test_state_operator_handoff_review.py'
      - 'test/test_replication_factory_preflight.py'
      - 'test/test_sdk_state_facade.py'
      - '.github/workflows/g3-writer-fencing-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g3-writer-fencing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fencing:
    name: G3 witness (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      SOFIA_STATE_ROOT: ${{ github.workspace }}/state/cloud-runtime
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated runtime state
        shell: bash
        run: |
          mkdir -p "$SOFIA_STATE_ROOT"
          test -w "$SOFIA_STATE_ROOT"
      - name: Install test environment
        run: python -m pip install -e . pytest
      - name: Verify dependencies and compile
        run: |
          python -m pip check
          python -m compileall -q src/sofia test
      - name: Test witness fencing, handoff and state facades
        run: |
          python -m pytest -q test/test_state_replication.py test/test_state_operator_handoff_review.py test/test_replication_factory_preflight.py test/test_sdk_state_facade.py
