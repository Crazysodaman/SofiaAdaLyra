name: G4 Core Link Transport CI

on:
  push:
    branches:
      - chatgpt/g4-core-link-transport
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: g4 (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      SOFIA_STATE_ROOT: ${{ github.workspace }}/state/cloud-runtime
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checked-out exact PR HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Isolate runtime state
        shell: bash
        run: |
          mkdir -p "$SOFIA_STATE_ROOT"
          test -w "$SOFIA_STATE_ROOT"
      - name: Install test dependencies
        run: python -m pip install -e . pytest
      - name: Verify imports and dependencies
        run: |
          python -m pip check
          python -m compileall -q src/sofia test
      - name: Run g4 regressions
        run: python -m pytest -q test/test_core_link_conversation.py test/test_core_link_binding.py test/test_core_link_desktop.py test/test_platform_roles_and_launcher.py test/test_core004_wire_security.py test/test_core004_admission_fence.py test/test_core004_client_deadline.py test/test_core004_history_paging.py test/test_core004_real_mtls_reconnect.py test/test_core004_real_inference_opt_in.py
      - name: Run grant revocation boundary regressions
        run: python -m pytest -q test/test_distributed_revocation_races.py test/test_distributed_operations.py test/test_distributed_durable.py
