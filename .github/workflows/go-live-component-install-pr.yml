name: GO LIVE Component Install PR Verification

on:
  push:
    branches:
      - chatgpt/go-live-release-env-version
    paths:
      - 'src/sofia/platform/ops/component_install.py'
      - 'src/sofia/platform/run/active_release.py'
      - 'test/test_core_component_install.py'
      - 'test/test_run_active_release.py'
      - '.github/workflows/go-live-component-install-pr.yml'
  pull_request:
    paths:
      - 'src/sofia/platform/ops/component_install.py'
      - 'src/sofia/platform/run/active_release.py'
      - 'test/test_core_component_install.py'
      - 'test/test_run_active_release.py'
      - 'test/test_component_artifact_separation.py'
      - 'test/test_component_install_production.py'
      - '.github/workflows/go-live-component-install-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-live-component-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  component-install:
    name: Component install (${{ matrix.os }}, Python 3.12)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    env:
      SOFIA_STATE_ROOT: ${{ github.workspace }}/state/cloud-runtime
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout proposed exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Initialize ignored state root
        shell: bash
        run: |
          mkdir -p "$SOFIA_STATE_ROOT"
          test -w "$SOFIA_STATE_ROOT"
      - name: Install test dependencies
        run: python -m pip install -e . pytest
      - name: Verify dependency resolution
        run: python -m pip check
      - name: Compile changed source and test package
        run: python -m compileall -q src/sofia test
      - name: Run component release and installer regression tests
        run: |
          python -m pytest -q test/test_core_component_install.py test/test_run_active_release.py test/test_component_artifact_separation.py test/test_component_install_production.py
