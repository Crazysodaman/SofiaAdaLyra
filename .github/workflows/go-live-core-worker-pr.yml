name: GO LIVE Core Worker Process Regression (G2)

on:
  push:
    branches: [chatgpt/go-live-release-env-version]
    paths:
      - 'src/sofia/platform/core_worker/**'
      - 'src/sofia/platform/composition/**'
      - 'src/sofia/platform/run/**'
      - 'test/test_core_worker_process.py'
      - '.github/workflows/go-live-core-worker-pr.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/sofia/platform/core_worker/**'
      - 'src/sofia/platform/composition/**'
      - 'src/sofia/platform/run/**'
      - 'test/test_core_worker_process.py'
      - '.github/workflows/go-live-core-worker-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-live-core-worker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-worker:
    name: Core worker process (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      SOFIA_STATE_ROOT: ${{ github.workspace }}/state/core-worker-test
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Initialize disposable test state
        shell: bash
        run: |
          mkdir -p "$SOFIA_STATE_ROOT"
          test -w "$SOFIA_STATE_ROOT"
      - name: Install project and test dependencies
        run: python -m pip install -e . pytest
      - name: Verify dependency graph
        run: python -m pip check
      - name: Exercise real spawned Core process, generation fence and restart
        run: python -m pytest -q test/test_core_worker_process.py

# Targeted process lifecycle acceptance only. Does not prove independently
# installed Core artifact, full app acceptance, authorizer composition,
# real Venus-Artemis migration or sole production writer.
