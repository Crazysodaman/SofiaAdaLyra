name: Manual Verification

concurrency:
  # Preserve in-flight exact-SHA verification evidence when main advances.
  # Manual dispatches are revision-specific and should never replace another
  # explicit verification. Automatic main pushes may coalesce pending runs,
  # but must not terminate a started 8K+ test verification.
  group: verify-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      phase:
        description: Verification phase
        required: true
        default: full
        type: choice
        options:
          - static
          - full
          - prelive

jobs:
  verify:
    runs-on: windows-latest
    # The full gate needs the same budget as the release-candidate build job;
    # the former 20-minute ceiling cancelled complete verification runs.
    timeout-minutes: 120
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project
        shell: pwsh
        run: python -m pip install -e ".[rust-contract-tests]" pytest

      - name: Run revision-pinned verification
        shell: pwsh
        run: >
          python -m sofia.platform.verify.gate
          --phase "${{ github.event_name == 'workflow_dispatch' && inputs.phase || 'full' }}"
          --evidence-path verify-evidence.json

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-evidence-${{ github.sha }}
          path: verify-evidence.json
          if-no-files-found: error
