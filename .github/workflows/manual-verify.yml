name: Manual Verification

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Verification phase
        required: true
        default: full
        type: choice
        options:
          - static
          - full

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        shell: pwsh
        run: python -m pip install -e . pytest

      - name: Run revision-pinned verification
        shell: pwsh
        run: >
          python -m sofia.verify.gate
          --phase "${{ inputs.phase }}"
          --evidence-path verify-evidence.json

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence-${{ github.sha }}
          path: verify-evidence.json
          if-no-files-found: error
