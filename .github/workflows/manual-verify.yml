name: Manual Verification

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      phase:
        description: Verification phase
        required: true
        default: full
        type: choice
        options:
          - static
          - full
          - prelive

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project
        shell: pwsh
        run: python -m pip install -e . pytest

      - name: Run revision-pinned verification
        shell: pwsh
        run: >
          python -m sofia.verify.gate
          --phase "${{ github.event_name == 'workflow_dispatch' && inputs.phase || 'full' }}"
          --evidence-path verify-evidence.json

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-evidence-${{ github.sha }}
          path: verify-evidence.json
          if-no-files-found: error
