name: Matrix Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: matrix-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project
        shell: pwsh
        run: python -m pip install -e . pytest

      - name: Compile matrix paths
        shell: pwsh
        run: python -m compileall -q src/sofia test

      - name: Run matrix regression gate
        shell: pwsh
        run: |
          pytest -q `
            test/test_cognition_matrix.py `
            test/test_contextual_influence_matrix.py `
            test/test_memory_promoted_retrieval.py `
            test/test_memory_runtime_wiring.py `
            test/test_voice_matrix.py `
            test/test_voice_runtime_matrix.py `
            test/test_voice_prosody_matrix.py `
            test/test_rel_habit_matrix.py `
            test/test_semantic_domain_matrix.py `
            test/test_release_compatibility_matrix.py `
            test/test_ops_failure_recovery_matrix.py `
            test/test_avatar_behavior_matrix.py `
            test/test_emotional_behavior_matrix.py `
            test/test_environment_behavior_matrix.py `
            test/test_interaction_behavior_matrix.py `
            test/test_habit_contextual_matrix.py `
            test/test_emotional_conversation_integration.py `
            test/test_cognitive_activity.py `
            test/test_cognitive_routing.py `
            test/test_model_lifecycle.py `
            test/test_production_dual_cognition.py `
            test/test_ui_tray_models.py `
            test/test_ui_desktop_controller.py `
            test/test_ui_desktop_worker.py `
            test/test_ui_application.py `
            test/test_ui_text_client.py `
            test/test_conversation_loop.py `
            test/test_conversational_context_projection.py `
            test/test_discord_bridge.py `
            test/test_conversation_service.py::test_matrix_context_window_applies_typed_history_limits `
            test/test_conversation_service.py::test_matrix_context_window_filters_excluded_domains_across_history_policies `
            test/test_conversation_service.py::test_last_turn_followup_inherits_prior_semantic_domains_as_context_only `
            test/test_conversation_service.py::test_conversation_records_active_matrix_trace_before_persistence `
            test/test_conversation_service.py::test_channel_propagates_through_full_conversation_stack_to_matrix_trace `
            test/test_conversation_service.py::test_matrix_context_failure_falls_back_to_legacy_history `
            test/test_conversation_service.py::test_matrix_hru_routes_fast_and_records_validation `
            test/test_conversation_service.py::test_matrix_network_no_evidence_is_recorded_without_fake_health `
            test/test_conversation_service.py::test_runtime_promotes_host_execution_receipt_evidence `
            test/test_conversation_service.py::test_allowed_receipt_backed_action_claim_persists `
            test/test_conversation_service.py::test_matrix_action_claim_is_rewritten_before_persistence `
            test/test_conversation_service.py::test_interaction_stop_completes_active_matrix_trace_without_llm `
            test/test_conversation_service.py::test_fast_matrix_trace_records_actual_secondary_model_execution `
            test/test_conversation_service.py::test_verify_matrix_trace_proves_primary_secondary_primary_execution
