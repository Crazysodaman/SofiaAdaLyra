name: MENTOR Read-only Quality Audit
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mentor-readonly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mentor-audit:
    name: MENTOR inventory and evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Exact source checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Focused MENTOR tests (stdlib only)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s test -p 'test_mentor_*.py' -v
      - name: Source-pinned 780-task QA snapshot
        env:
          PYTHONPATH: src
        run: python -m sofia.mentor audit --repo . --output mentor-report.json --markdown mentor-summary.md
      - name: Reconcile all unclassified V18 tasks without promotions
        env:
          PYTHONPATH: src
        run: python -m sofia.mentor.bulk_reconcile --repo . --output mentor-bulk.json --csv mentor-bulk.csv
      - name: Verify public Git mailbox is readable and safe
        env:
          PYTHONPATH: src
        run: |
          python -m sofia.mentor exchange-read --repo . > /dev/null
          python -m sofia.mentor exchange-export --repo . > /dev/null
      - name: Add owner-readable summary
        if: always()
        shell: bash
        run: |
          if [ -f mentor-summary.md ]; then
            cat mentor-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload read-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mentor-audit-${{ github.sha }}
          path: |
            mentor-report.json
            mentor-summary.md
            mentor-bulk.json
            mentor-bulk.csv
          if-no-files-found: warn
          retention-days: 30

  functional-regressions:
    name: MENTOR selected function regressions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Exact source checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Sofía and test dependencies
        run: python -m pip install -e . pytest
      - name: Personality, vision, safety and learning regressions
        run: >-
          python -m pytest -q
          test/test_personality_pipeline.py
          test/test_personality_expression_g9.py
          test/test_conversation_emotion_appraisal.py
          test/test_emotional_conversation_integration.py
          test/test_emotional_conversation_mentor_hook.py
          test/test_current_emotional_state.py
          test/test_vision_cross_platform.py
          test/test_vision_action_workflow.py
          test/test_generalization_foundation.py
          test/test_verify_generalization_transfer.py
          --junitxml=mentor-functional-junit.xml
      - name: Preserve real-host acceptance boundaries
        if: always()
        run: echo 'Synthetic and local unit tests are not physical Windows/GPU/FIDO2, voice/avatar rendering, or real learning-transfer acceptance.'
      - name: Upload selected regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mentor-regressions-${{ github.sha }}
          path: mentor-functional-junit.xml
          if-no-files-found: warn
          retention-days: 30
