name: Package Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: package-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.package }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - pkg_core
          - pkg_interact
          - pkg_mem
          - pkg_social
          - pkg_net
          - pkg_ui
          - pkg_voice
          - pkg_run
          - pkg_ops
          - pkg_act
          - pkg_rel
          - pkg_avatar
          - pkg_dev
          - pkg_body
          - pkg_evolve
          - pkg_clean
          - pkg_know
          - pkg_integrate
          - pkg_environment
          - pkg_habit
          - pkg_safe
          - pkg_verify

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project
        shell: pwsh
        run: python -m pip install -e . pytest

      - name: Run package tests
        shell: pwsh
        run: pytest -q -m "${{ matrix.package }} and not integration"
