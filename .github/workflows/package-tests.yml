name: Package Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Explicit Gate-4 dispatches are SHA-specific and never displaced by
  # unrelated rapid main pushes. Automatic push runs still coalesce by ref.
  group: package-tests-${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
  # Keep a started revision alive for exact-SHA evidence even when main
  # receives subsequent commits. GitHub may still replace pending runs.
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.package }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - pkg_core
          - pkg_interact
          - pkg_mem
          - pkg_social
          - pkg_net
          - pkg_ui
          - pkg_voice
          - pkg_run
          - pkg_ops
          - pkg_act
          - pkg_rel
          - pkg_avatar
          - pkg_dev
          - pkg_body
          - pkg_evolve
          - pkg_clean
          - pkg_know
          - pkg_integrate
          - pkg_environment
          - pkg_habit
          - pkg_safe
          - pkg_verify

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project
        shell: pwsh
        run: python -m pip install -e . pytest

      - name: Prove nonempty package selection without running tests
        shell: pwsh
        run: |
          python -m sofia.verify.package_selection --repo "$env:GITHUB_WORKSPACE" --marker "${{ matrix.package }}" --receipt "package-selection-${{ matrix.package }}.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run package tests
        shell: pwsh
        run: |
          $Log = "pytest-${{ matrix.package }}.log"
          pytest -q -m "${{ matrix.package }} and not integration" 2>&1 |
            Tee-Object -FilePath $Log
          $Status = $LASTEXITCODE
          if ($Status -ne 0) {
            "### ${{ matrix.package }} failure tail" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "``````text" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Get-Content $Log -Tail 160 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          exit $Status

      - name: Upload exact revision selection proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-selection-${{ matrix.package }}-${{ github.sha }}
          path: |
            package-selection-${{ matrix.package }}.json
            pytest-${{ matrix.package }}.log
          if-no-files-found: warn
