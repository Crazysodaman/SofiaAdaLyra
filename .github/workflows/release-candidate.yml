name: Release Candidate Build

on:
  push:
    branches:
      - main
      - chatgpt/go-live-release-env-version
  workflow_dispatch:
    inputs:
      release_id:
        description: Optional explicit release ID
        required: false
        type: string
      parent_release_id:
        description: Optional accepted parent release ID
        required: false
        type: string
      parent_manifest_sha256:
        description: Optional accepted parent manifest SHA-256
        required: false
        type: string

concurrency:
  # Explicit Gate-4 dispatches are SHA-specific and never displaced by
  # unrelated rapid main pushes. Automatic push runs still coalesce by ref.
  group: release-candidate-${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
  # Cancel superseded GO LIVE development pushes only. Main release history
  # and explicit release dispatches keep their independent evidence.
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/chatgpt/go-live-release-env-version' }}

jobs:
  build:
    runs-on: windows-latest
    # The installed-wheel full gate currently exercises more than 6,000 tests.
    # Windows runners have exceeded the former 30- and 60-minute ceilings
    # without a test failure, which discarded the verification evidence
    # mid-run. GitHub-hosted runners allow up to 360 minutes per job.
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Materialize clean tracked source
        shell: pwsh
        run: |
          # Stage clean tracked source OUTSIDE the checkout. An in-tree
          # release-source/test directory otherwise duplicates pytest modules.
          $sourceRoot = Join-Path $env:RUNNER_TEMP "sofia-release-source"
          "SOFIA_RELEASE_SOURCE=$sourceRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SOFIA_RELEASE_VENV=$(Join-Path $env:RUNNER_TEMP 'sofia-release-venv')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SOFIA_RELEASE_EVIDENCE=$(Join-Path $env:RUNNER_TEMP 'source-provenance.json')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SOFIA_VERIFICATION_EVIDENCE=$(Join-Path $env:RUNNER_TEMP 'verification-evidence.json')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Stage raw reviewed Git objects. A Windows tar extraction can
          # rewrite text newlines and break HEAD-to-wheel byte provenance.
          python src/sofia/platform/verify/stage_release_source.py --checkout "$env:GITHUB_WORKSPACE" --target "$sourceRoot"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify exact hashed runtime lock
        shell: pwsh
        run: |
          python -m venv "$env:SOFIA_RELEASE_VENV"
          # Keep the interpreter-bundled pip; do not fetch an unpinned toolchain.
          & "$env:SOFIA_RELEASE_VENV\Scripts\python.exe" -m pip install --require-hashes -r requirements.lock.windows-py312.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:SOFIA_RELEASE_VENV\Scripts\python.exe" -m pip install --require-hashes -r requirements.verify.lock.windows-py312.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:SOFIA_RELEASE_VENV\Scripts\python.exe" -m pip install --require-hashes --only-binary=:all: -r requirements.build.lock.windows-py312.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build wheel twice and require reproducibility
        shell: pwsh
        run: |
          $env:SOURCE_DATE_EPOCH = git show -s --format=%ct HEAD
          # Keep temporary wheels outside the exact-SHA checkout.
          $distA = Join-Path $env:RUNNER_TEMP "sofia-dist-a"
          $distB = Join-Path $env:RUNNER_TEMP "sofia-dist-b"
          New-Item -ItemType Directory -Force $distA,$distB | Out-Null
          # setuptools may write build metadata into source directories.
          # Build from two disposable copies; retain the exact Git HEAD stage
          # unmodified for post-install provenance verification.
          $sourceA = Join-Path $env:RUNNER_TEMP "sofia-source-build-a"
          $sourceB = Join-Path $env:RUNNER_TEMP "sofia-source-build-b"
          python -c "import os,pathlib,shutil;root=pathlib.Path(os.environ['SOFIA_RELEASE_SOURCE']);temp=pathlib.Path(os.environ['RUNNER_TEMP']);shutil.copytree(root,temp/'sofia-source-build-a');shutil.copytree(root,temp/'sofia-source-build-b')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:SOFIA_RELEASE_VENV\Scripts\python.exe" -m pip wheel --no-build-isolation --no-deps --wheel-dir "$distA" "$sourceA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:SOFIA_RELEASE_VENV\Scripts\python.exe" -m pip wheel --no-build-isolation --no-deps --wheel-dir "$distB" "$sourceB"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $WheelA = Get-ChildItem -LiteralPath $distA -Filter *.whl -File | Select-Object -First 1
          $WheelB = Get-ChildItem -LiteralPath $distB -Filter *.whl -File | Select-Object -First 1
          if ($null -eq $WheelA -or $null -eq $WheelB) { throw "reproducibility build did not create both wheels" }
          $HashA = (Get-FileHash -Algorithm SHA256 $WheelA.FullName).Hash.ToLowerInvariant()
          $HashB = (Get-FileHash -Algorithm SHA256 $WheelB.FullName).Hash.ToLowerInvariant()
          Write-Output "wheel_a_sha256=$HashA"
          Write-Output "wheel_b_sha256=$HashB"
          if ($HashA -ne $HashB) { throw "release wheel is not reproducible" }
          "RELEASE_WHEEL=$($WheelA.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_WHEEL_SHA256=$HashA" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install exactly the reproducibly built candidate wheel
        shell: pwsh
        run: |
          $wheelPath = $env:RELEASE_WHEEL
          if (-not (Test-Path -LiteralPath $wheelPath -PathType Leaf)) { throw "candidate wheel is missing" }
          $actualHash = (Get-FileHash -LiteralPath $wheelPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:RELEASE_WHEEL_SHA256) { throw "candidate wheel changed after reproducibility proof" }
          & "$env:SOFIA_RELEASE_VENV\Scripts\python.exe" -m pip install --no-index --no-deps --force-reinstall "$wheelPath"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assert exact source and installed package provenance
        shell: pwsh
        run: |
          & "$env:SOFIA_RELEASE_VENV\Scripts\python.exe" -m sofia.platform.verify.source_provenance `
            --checkout "$env:GITHUB_WORKSPACE" `
            --archive "$env:SOFIA_RELEASE_SOURCE" `
            --venv "$env:SOFIA_RELEASE_VENV" `
            --evidence "$env:SOFIA_RELEASE_EVIDENCE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run revision-bound verification gate
        shell: pwsh
        run: |
          $Log = "$env:RUNNER_TEMP\sofia-windows-verification.log"
          & "$env:SOFIA_RELEASE_VENV\Scripts\python.exe" -m sofia.platform.verify.gate --phase full --installed-wheel-only --repo "$env:GITHUB_WORKSPACE" --evidence-path "$env:SOFIA_VERIFICATION_EVIDENCE" 2>&1 |
            Tee-Object -FilePath $Log
          $Status = $LASTEXITCODE
          if ($Status -ne 0) {
            "### Windows verification failure tail" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "``````text" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Get-Content $Log -Tail 200 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          exit $Status

      - name: Upload Windows verification diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-verification-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sofia-windows-verification.log
            ${{ runner.temp }}/verification-evidence.json
            ${{ runner.temp }}/source-provenance.json
          if-no-files-found: warn

      - name: Construct and verify separated component artifacts
        shell: pwsh
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          $Py = "$env:SOFIA_RELEASE_VENV\Scripts\python.exe"
          $AppVersion = & $Py -c "from sofia.core.package_metadata import application_version; print(application_version())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Py -m sofia.platform.verify.component_artifacts `
            --output "$env:RUNNER_TEMP\sofia-components" `
            --repo "$env:GITHUB_WORKSPACE" `
            --version "$AppVersion" 2>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP\sofia-components.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Sdk = (Get-ChildItem "$env:RUNNER_TEMP\sofia-components\sofia_sdk-*.whl" | Select-Object -First 1).FullName
          $Platform = (Get-ChildItem "$env:RUNNER_TEMP\sofia-components\sofia_platform-*.whl" | Select-Object -First 1).FullName
          $Core = (Get-ChildItem "$env:RUNNER_TEMP\sofia-components\sofia_core-*.whl" | Select-Object -First 1).FullName
          $Args = @(
            "-m","sofia.platform.dev.release_cli","construct",
            "--git-revision","${{ github.sha }}",
            "--lock","requirements.lock.windows-py312.txt",
            "--component-wheel","sdk=$Sdk",
            "--component-wheel","platform=$Platform",
            "--component-wheel","core=$Core",
            "--source",$env:SOFIA_RELEASE_SOURCE,
            "--constitution-hash",(Join-Path $env:SOFIA_RELEASE_SOURCE "src\sofia\core\constitution\constitution.sha256"),
            "--verification-evidence",$env:SOFIA_VERIFICATION_EVIDENCE,
            "--output","release-evidence-components"
          )
          if ($env:RELEASE_ID) {
            $Args += @("--release-id","$env:RELEASE_ID-components")
          }
          & $Py @Args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Py -m sofia.platform.dev.release_cli verify --release-dir release-evidence-components
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload separated component release candidate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-components-${{ github.sha }}
          path: |
            release-evidence-components
            ${{ runner.temp }}/sofia-components.log
          if-no-files-found: error

      - name: Construct and verify release evidence
        shell: pwsh
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          PARENT_RELEASE_ID: ${{ inputs.parent_release_id }}
          PARENT_MANIFEST_SHA256: ${{ inputs.parent_manifest_sha256 }}
        run: |
          $Args = @(
            "-m","sofia.platform.dev.release_cli","construct",
            "--git-revision","${{ github.sha }}",
            "--lock","requirements.lock.windows-py312.txt",
            "--wheel",$env:RELEASE_WHEEL,
            "--source",$env:SOFIA_RELEASE_SOURCE,
            "--constitution-hash",(Join-Path $env:SOFIA_RELEASE_SOURCE "src\sofia\core\constitution\constitution.sha256"),
            "--verification-evidence",$env:SOFIA_VERIFICATION_EVIDENCE,
            "--output","release-evidence"
          )
          if ($env:RELEASE_ID) {
            $Args += @("--release-id",$env:RELEASE_ID)
          }
          if ($env:PARENT_RELEASE_ID -or $env:PARENT_MANIFEST_SHA256) {
            if (-not $env:PARENT_RELEASE_ID -or -not $env:PARENT_MANIFEST_SHA256) {
              throw "parent release ID and parent manifest SHA-256 must be supplied together"
            }
            $Args += @("--parent-release-id",$env:PARENT_RELEASE_ID)
            $Args += @("--parent-manifest-sha256",$env:PARENT_MANIFEST_SHA256)
          }
          & "$env:SOFIA_RELEASE_VENV\Scripts\python.exe" @Args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:SOFIA_RELEASE_VENV\Scripts\python.exe" -m sofia.platform.dev.release_cli verify --release-dir release-evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload unsigned release candidate evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            release-evidence
            ${{ runner.temp }}/source-provenance.json
          if-no-files-found: error
