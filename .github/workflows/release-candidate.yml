name: Release Candidate Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_id:
        description: Optional explicit release ID
        required: false
        type: string
      parent_release_id:
        description: Optional accepted parent release ID
        required: false
        type: string
      parent_manifest_sha256:
        description: Optional accepted parent manifest SHA-256
        required: false
        type: string

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Materialize clean tracked source
        shell: pwsh
        run: |
          # Stage clean tracked source OUTSIDE the checkout. An in-tree
          # release-source/test directory otherwise duplicates pytest modules.
          $sourceRoot = Join-Path $env:RUNNER_TEMP "sofia-release-source"
          "SOFIA_RELEASE_SOURCE=$sourceRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force "$sourceRoot" | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP "sofia-tracked-source.tar"
          git archive --format=tar HEAD -o "$archive"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tar -xf "$archive" -C "$sourceRoot"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify exact hashed runtime lock
        shell: pwsh
        run: |
          python -m venv .releasevenv
          # Keep the interpreter-bundled pip; do not fetch an unpinned toolchain.
          .\.releasevenv\Scripts\python.exe -m pip install --require-hashes -r requirements.lock.windows-py312.txt
          .\.releasevenv\Scripts\python.exe -m pip install --require-hashes -r requirements.verify.lock.windows-py312.txt
          .\.releasevenv\Scripts\python.exe -m pip install --no-deps "$env:SOFIA_RELEASE_SOURCE"

      - name: Assert exact source and installed package provenance
        shell: pwsh
        run: |
          .\.releasevenv\Scripts\python.exe -m sofia.verify.source_provenance `
            --checkout "$env:GITHUB_WORKSPACE" `
            --archive "$env:SOFIA_RELEASE_SOURCE" `
            --venv ".releasevenv" `
            --evidence "source-provenance.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run revision-bound verification gate
        shell: pwsh
        run: |
          .\.releasevenv\Scripts\python.exe -m sofia.verify.gate --phase full --repo "$env:GITHUB_WORKSPACE" --evidence-path verification-evidence.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build wheel twice and require reproducibility
        shell: pwsh
        run: |
          $env:SOURCE_DATE_EPOCH = git show -s --format=%ct HEAD
          New-Item -ItemType Directory -Force dist-a,dist-b | Out-Null
          .\.releasevenv\Scripts\python.exe -m pip wheel --no-deps --wheel-dir dist-a "$env:SOFIA_RELEASE_SOURCE"
          .\.releasevenv\Scripts\python.exe -m pip wheel --no-deps --wheel-dir dist-b "$env:SOFIA_RELEASE_SOURCE"
          $WheelA = Get-ChildItem dist-a\*.whl | Select-Object -First 1
          $WheelB = Get-ChildItem dist-b\*.whl | Select-Object -First 1
          if ($null -eq $WheelA -or $null -eq $WheelB) { throw "reproducibility build did not create both wheels" }
          $HashA = (Get-FileHash -Algorithm SHA256 $WheelA.FullName).Hash.ToLowerInvariant()
          $HashB = (Get-FileHash -Algorithm SHA256 $WheelB.FullName).Hash.ToLowerInvariant()
          Write-Output "wheel_a_sha256=$HashA"
          Write-Output "wheel_b_sha256=$HashB"
          if ($HashA -ne $HashB) { throw "release wheel is not reproducible" }
          Copy-Item $WheelA.FullName $WheelA.Name
          "RELEASE_WHEEL=$($WheelA.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Construct and verify release evidence
        shell: pwsh
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          PARENT_RELEASE_ID: ${{ inputs.parent_release_id }}
          PARENT_MANIFEST_SHA256: ${{ inputs.parent_manifest_sha256 }}
        run: |
          $Args = @(
            "-m","sofia.dev.release_cli","construct",
            "--git-revision","${{ github.sha }}",
            "--lock","requirements.lock.windows-py312.txt",
            "--wheel",$env:RELEASE_WHEEL,
            "--source",$env:SOFIA_RELEASE_SOURCE,
            "--constitution-hash",(Join-Path $env:SOFIA_RELEASE_SOURCE "src\sofia\constitution\constitution.sha256"),
            "--verification-evidence","verification-evidence.json",
            "--output","release-evidence"
          )
          if ($env:RELEASE_ID) {
            $Args += @("--release-id",$env:RELEASE_ID)
          }
          if ($env:PARENT_RELEASE_ID -or $env:PARENT_MANIFEST_SHA256) {
            if (-not $env:PARENT_RELEASE_ID -or -not $env:PARENT_MANIFEST_SHA256) {
              throw "parent release ID and parent manifest SHA-256 must be supplied together"
            }
            $Args += @("--parent-release-id",$env:PARENT_RELEASE_ID)
            $Args += @("--parent-manifest-sha256",$env:PARENT_MANIFEST_SHA256)
          }
          & .\.releasevenv\Scripts\python.exe @Args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.releasevenv\Scripts\python.exe -m sofia.dev.release_cli verify --release-dir release-evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload unsigned release candidate evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            release-evidence
            source-provenance.json
          if-no-files-found: error
