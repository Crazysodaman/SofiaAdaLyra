name: Release Candidate Build

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Optional explicit release ID
        required: false
        type: string
      parent_release_id:
        description: Optional accepted parent release ID
        required: false
        type: string
      parent_manifest_sha256:
        description: Optional accepted parent manifest SHA-256
        required: false
        type: string

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize clean tracked source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-source | Out-Null
          git archive --format=tar HEAD -o source.tar
          tar -xf source.tar -C release-source

      - name: Verify exact hashed runtime lock
        shell: pwsh
        run: |
          python -m venv .releasevenv
          .\.releasevenv\Scripts\python.exe -m pip install --upgrade pip
          .\.releasevenv\Scripts\python.exe -m pip install --require-hashes -r requirements.lock.windows-py312.txt
          .\.releasevenv\Scripts\python.exe -m pip install --no-deps release-source

      - name: Build wheel twice and require reproducibility
        shell: pwsh
        run: |
          $env:SOURCE_DATE_EPOCH = git show -s --format=%ct HEAD
          New-Item -ItemType Directory -Force dist-a,dist-b | Out-Null
          .\.releasevenv\Scripts\python.exe -m pip wheel --no-deps --wheel-dir dist-a release-source
          .\.releasevenv\Scripts\python.exe -m pip wheel --no-deps --wheel-dir dist-b release-source
          $WheelA = Get-ChildItem dist-a\*.whl | Select-Object -First 1
          $WheelB = Get-ChildItem dist-b\*.whl | Select-Object -First 1
          if ($null -eq $WheelA -or $null -eq $WheelB) { throw "reproducibility build did not create both wheels" }
          $HashA = (Get-FileHash -Algorithm SHA256 $WheelA.FullName).Hash.ToLowerInvariant()
          $HashB = (Get-FileHash -Algorithm SHA256 $WheelB.FullName).Hash.ToLowerInvariant()
          Write-Output "wheel_a_sha256=$HashA"
          Write-Output "wheel_b_sha256=$HashB"
          if ($HashA -ne $HashB) { throw "release wheel is not reproducible" }
          Copy-Item $WheelA.FullName release-wheel.whl

      - name: Construct and verify release evidence
        shell: pwsh
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          PARENT_RELEASE_ID: ${{ inputs.parent_release_id }}
          PARENT_MANIFEST_SHA256: ${{ inputs.parent_manifest_sha256 }}
        run: |
          $Args = @(
            "-m","sofia.dev.release_cli","construct",
            "--git-revision","${{ github.sha }}",
            "--lock","requirements.lock.windows-py312.txt",
            "--wheel","release-wheel.whl",
            "--source","release-source",
            "--constitution-hash","release-source\src\sofia\constitution\constitution.sha256",
            "--output","release-evidence"
          )
          if ($env:RELEASE_ID) {
            $Args += @("--release-id",$env:RELEASE_ID)
          }
          if ($env:PARENT_RELEASE_ID -or $env:PARENT_MANIFEST_SHA256) {
            if (-not $env:PARENT_RELEASE_ID -or -not $env:PARENT_MANIFEST_SHA256) {
              throw "parent release ID and parent manifest SHA-256 must be supplied together"
            }
            $Args += @("--parent-release-id",$env:PARENT_RELEASE_ID)
            $Args += @("--parent-manifest-sha256",$env:PARENT_MANIFEST_SHA256)
          }
          & .\.releasevenv\Scripts\python.exe @Args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.releasevenv\Scripts\python.exe -m sofia.dev.release_cli verify --release-dir release-evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload unsigned release candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          path: release-evidence
          if-no-files-found: error
