name: Release regression focused tests

on:
  pull_request:
    paths:
      - "test/test_run_effect_broker.py"
      - "test/test_life_procedure_catalog.py"
      - "test/test_life_postrun_verification.py"
      - "test/test_presence_initiative.py"
      - "test/test_life_project_forge.py"
      - "test/test_sdk_rust_contract_compatibility.py"
      - "rust-toolchain.toml"
      - ".github/workflows/release-regression-hotfix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    name: RUN/LIFE / ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout revision
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[rust-contract-tests]" pytest
      - name: Run focused regression cases
        run: >
          python -m pytest -q
          test/test_run_effect_broker.py
          test/test_life_procedure_catalog.py::test_catalog_writer_rejects_stale_bytes_even_when_original_run_was_completed
          test/test_life_postrun_verification.py
          test/test_presence_initiative.py::test_life_outreach_operator_stop_after_model_choice_is_honored
          test/test_presence_initiative.py::test_verified_personal_life_work_can_start_owner_conversation
          test/test_life_project_forge.py::test_canonical_private_life_causal_trace_links_actual_work
      - name: Verify cross-language contract tool without Windows component collision
        run: python -m pytest -q test/test_sdk_rust_contract_compatibility.py::test_python_and_rust_accept_and_reject_identically
