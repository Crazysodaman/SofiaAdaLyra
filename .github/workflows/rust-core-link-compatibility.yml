name: R2 Rust Core Link Compatibility

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust/crates/sofia-core-link/**"
      - "contracts/core-link/**"
      - "test/test_rust_core_link_contract_compatibility.py"
      - ".github/workflows/rust-core-link-compatibility.yml"
  push:
    branches: ["codex/r2-readonly-core-link"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust Core Link ${{ matrix.os }} / ${{ matrix.profile }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        profile: [debug, release]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: matrix.profile == 'debug'
        run: cargo fmt --all --check
      - if: matrix.profile == 'debug'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - if: matrix.profile == 'debug'
        run: cargo test --workspace --locked
      - if: matrix.profile == 'release'
        run: cargo test --workspace --locked --release

  python-oracle:
    name: Python oracle ${{ matrix.os }} / ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest cryptography
      - run: cargo build --locked -p sofia-core-link --bin r2_core_link_probe
      - name: Python oracle and disposable mTLS interoperability
        env:
          SOFIA_R2_PROBE: ${{ runner.os == 'Windows' && format('{0}/target/debug/r2_core_link_probe.exe', github.workspace) || format('{0}/target/debug/r2_core_link_probe', github.workspace) }}
        run: python -m pytest -q test/test_rust_core_link_contract_compatibility.py test/test_core_link_conversation.py
