name: Rust lock refresh evidence (temporary)
on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "rust/crates/sofia-core-link/Cargo.toml"
      - ".github/workflows/rust-lock-refresh-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-lock:
    name: Reproducible Cargo lock resolution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - name: Resolve only approved reqwest and time versions
        shell: bash
        run: |
          set -euo pipefail
          cargo update --package reqwest --precise 0.12.28
          cargo update --package time --precise 0.3.47
          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path
          content = Path("Cargo.lock").read_bytes()
          print(f"SOFIA_LOCK_SHA256={hashlib.sha256(content).hexdigest()}", flush=True)
          print("SOFIA_LOCK_BASE64_BEGIN", flush=True)
          print(base64.b64encode(content).decode("ascii"), flush=True)
          print("SOFIA_LOCK_BASE64_END", flush=True)
          PY
      - name: Check regenerated lock in Linux Rust suite
        run: cargo test --workspace --locked
