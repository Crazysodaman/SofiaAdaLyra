name: SAFE Asynchronous FIDO2 Inbox

on:
  push:
    branches: [main]
    paths:
      - 'src/sofia/platform/safe/approval_inbox.py'
      - 'src/sofia/platform/safe/approval_inbox_cli.py'
      - 'src/sofia/platform/safe/owner_browser.py'
      - 'src/sofia/platform/safe/owner_webauthn.py'
      - 'src/sofia/platform/safe/execution_approval.py'
      - 'src/sofia/ui/owner_inbox_window.py'
      - 'src/sofia/ui/settings_window.py'
      - 'test/test_safe_approval_inbox.py'
      - '.github/workflows/safe-async-fido2-inbox.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safe-async-fido2-${{ github.sha }}
  cancel-in-progress: false

jobs:
  deterministic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e . pytest
      - name: Compile SAFE and desktop owner window
        run: python -m compileall -q src/sofia/platform/safe src/sofia/ui/owner_inbox_window.py
      - name: Verify durable inbox and existing WebAuthn regression
        run: python -m pytest -q test/test_safe_approval_inbox.py test/test_safe_owner_browser.py
