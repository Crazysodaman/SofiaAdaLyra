name: SAFE Owner Secret and FIDO2 Compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/sofia/platform/safe/**'
      - 'src/sofia/modules/ui/owner_inbox_window.py'
      - 'test/test_safe_owner_secret.py'
      - 'test/test_safe_owner_browser.py'
      - 'test/test_safe_approval_inbox.py'
      - 'test/test_safe_permissions.py'
      - 'test/test_safe_permission_owner_auth.py'
      - '.github/workflows/safe-owner-secret-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-regressions:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and test dependencies
        run: python -m pip install -e . pytest
      - name: Compile security implementation
        run: python -m compileall -q src/sofia/platform/safe src/sofia/modules/ui/owner_inbox_window.py test/test_safe_owner_secret.py
      - name: Exercise software credential and existing FIDO2 paths
        run: >-
          python -m pytest -q
          test/test_safe_owner_secret.py
          test/test_safe_owner_browser.py
          test/test_safe_approval_inbox.py
          test/test_safe_permissions.py
          test/test_safe_permission_owner_auth.py
          test/test_safe_operator_stop_revision.py
          test/test_safe_execution_action_fingerprint.py
