name: SDK Reference Module Conformance

on:
  pull_request:
    paths:
      - 'examples/sdk_reference_module/**'
      - 'src/sofia/sdk/**'
      - 'src/sofia/platform/modules/**'
      - 'src/sofia/platform/capability/**'
      - 'rust/crates/sofia-contracts/**'
      - 'test/test_sdk_reference_module.py'
      - 'test/test_module_lifecycle_v1.py'
      - 'test/test_platform_module_settings.py'
      - '.github/workflows/sdk-reference-conformance.yml'
  push:
    branches: [main]
    paths:
      - 'examples/sdk_reference_module/**'
      - 'src/sofia/sdk/**'
      - 'src/sofia/platform/modules/**'
      - 'src/sofia/platform/capability/**'
      - 'rust/crates/sofia-contracts/**'
      - 'test/test_sdk_reference_module.py'
      - '.github/workflows/sdk-reference-conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-reference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-sdk-reference:
    name: Reference module (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and test dependencies
        run: python -m pip install -e . pytest
      - name: Check installation
        run: python -m pip check
      - name: Compile reference and SDK tests
        run: python -m compileall -q examples/sdk_reference_module src/sofia/sdk test/test_sdk_reference_module.py
      - name: Verify signed test fixture, SDK parity, lifecycle and settings
        run: python -m pytest -q test/test_sdk_reference_module.py test/test_module_lifecycle_v1.py test/test_platform_module_settings.py
