name: V18 Decision Persistence Proof

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v18-decision-persistence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trace:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install production package and test framework
        run: python -m pip install -e . pytest

      - name: Prove source/decision persistence with fail-closed scenarios
        run: python -m pytest -q test/test_v18_decision_persistence.py test/test_v18_settled_response_trace.py test/test_v18_phase00_contracts.py
