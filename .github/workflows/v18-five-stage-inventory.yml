name: V18 Five-Stage Inventory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/v18_five_stage_audit.py'
      - 'test/test_v18_five_stage_audit.py'
      - 'docs/development/v18-full-780-task-design-code-gate-status-2026-10-17.md'
      - '.github/workflows/v18-five-stage-inventory.yml'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Validate inventory regression contract
        run: python -m pytest -q test/test_v18_five_stage_audit.py
      - name: Inventory exactly 700 CA and 80 ML/GA
        run: |
          python scripts/v18_five_stage_audit.py --repo . --sha "$GITHUB_SHA" --verify-head --output "$RUNNER_TEMP/v18-five-stage-status.json" --markdown-output "$RUNNER_TEMP/v18-five-stage-progress.md"
          python -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/v18-five-stage-status.json")); assert len(d["tasks"]) == 780; assert sum(d["counts"].values()) == 780; assert all(t["stage"] in d["counts"] for t in d["tasks"])'
      - uses: actions/upload-artifact@v4
        with:
          name: v18-five-stage-status
          path: |
            ${{ runner.temp }}/v18-five-stage-status.json
            ${{ runner.temp }}/v18-five-stage-progress.md
          retention-days: 30
