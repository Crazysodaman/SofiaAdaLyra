name: V18 Gate 4 Fifty Functional

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v18-gate4-fifty-${{ github.ref }}
  cancel-in-progress: true

jobs:
  six-linked-production-paths:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install production source for functional verification
        run: python -m pip install -e . pytest
      - name: Verify the fifty-task evidence boundary and execute functional regressions
        run: >-
          python -m pytest -q
          test/test_v18_gate4_batch50.py
          test/test_life_objective_parser_bounded.py
          test/test_life_atomic_admission.py
          test/test_creative_infrastructure.py
          test/test_verify_release_stage_git_tree.py
          test/test_life_autonomous_followthrough.py
          test/test_life_project_forge.py
          test/test_v18_success_oracle_contract.py
          test/test_life_procedure_catalog.py
          test/test_life_postrun_verification.py
          test/test_life_verified_milestone_production.py
          test/test_life_goal_run_resume_fence.py
          test/test_life_run_outcome_reconciliation.py
          test/test_life_operator_diagnostics.py
          test/test_life_no_placeholder_autonomous_authoring.py
          test/test_package_grouping.py
      - name: Emit source-bound Gate 4 status, no production claims
        run: >-
          python -m sofia.platform.verify.v18_gate4
          --repo .
          --output gate4-batch50-progress.json
          --markdown-output gate4-batch50-progress.md
      - name: Publish exact revision evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate4-batch50-${{ matrix.os }}-${{ github.sha }}
          path: |
            gate4-batch50-progress.json
            gate4-batch50-progress.md
          if-no-files-found: warn
          retention-days: 30
