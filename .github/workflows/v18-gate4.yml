name: V18 Gate 4 Progress

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v18-gate4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package and pytest
        run: python -m pip install -e . pytest
      - name: Test gate tracking and source integrity
        run: python -m pytest -q test/test_v18_gate4.py test/test_v18_ci_receipts.py test/test_v18_gate4_review.py test/test_v18_gate4_acceptance.py test/test_v18_first200_work.py
      - name: Generate evidence-only Gate 4 report
        env:
          # External reviewer trust anchors are an optional owner-provisioned
          # repository secret. No self-declared key from source is trusted.
          SOFIA_GATE4_TRUSTED_REVIEWER_KEYS: ${{ secrets.SOFIA_GATE4_TRUSTED_REVIEWER_KEYS }}
        run: >-
          python -m sofia.verify.v18_gate4
          --repo .
          --output gate4-progress.json
          --markdown-output gate4-progress.md
      - name: Authenticate recorded successful GitHub runs at exact revisions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -m sofia.verify.v18_ci_receipts
          --repo .
          --output gate4-remote-ci-receipts.json
      - name: Inventory incomplete independent review without promoting gates
        run: >-
          python -m sofia.verify.v18_gate4_review
          --repo .
          --output gate4-review-readiness.json
      - name: Report first 200 exact-priority tasks without self-promotion
        run: >-
          python -m sofia.verify.v18_first200_work
          --repo .
          --output gate4-first200-ordered.json
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate4-progress-${{ github.sha }}
          path: |
            gate4-progress.json
            gate4-progress.md
            gate4-remote-ci-receipts.json
            gate4-review-readiness.json
            gate4-first200-ordered.json
          if-no-files-found: warn
          retention-days: 30
