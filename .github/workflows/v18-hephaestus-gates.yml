name: V18 Hephaestus Source Acceptance
on:
  push:
    branches: [main]
    paths:
      - 'src/sofia/platform/ops/workshop_*.py'
      - 'src/sofia/platform/ops/digital_twin.py'
      - 'src/sofia/integrations/hyperv.py'
      - 'test/test_ops_workshop_*.py'
      - 'test/test_ui_workshop_owner_webauthn.py'
      - 'test/test_ops_digital_twin_production.py'
      - '.github/workflows/v18-hephaestus-gates.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v18-hephaestus-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-safety:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - name: Compile production Hephaestus Python modules
        run: python -m compileall -q src/sofia/platform/ops src/sofia/integrations/hyperv.py
      - name: Workshop, guest, attestation and synthetic twin tests
        run: >
          python -m pytest -q
          test/test_ops_workshop_guest_bootstrap_production.py
          test/test_ops_workshop_handoff_production.py
          test/test_ops_workshop_hyperv_production.py
          test/test_ops_workshop_internal_network.py
          test/test_ops_workshop_internal_stage.py
          test/test_ops_workshop_media_attestation_production.py
          test/test_ops_workshop_media_production.py
          test/test_ops_workshop_stage_report_boundary.py
          test/test_ops_workshop_vm_separation.py
          test/test_ui_workshop_owner_webauthn.py
          test/test_ops_digital_twin_production.py
      - name: Live-host acceptance deliberately not implied
        run: echo 'CI did NOT provision Artemis, install Hephaestus, create Hyper-V switches, execute guest binaries or prove network isolation.'
