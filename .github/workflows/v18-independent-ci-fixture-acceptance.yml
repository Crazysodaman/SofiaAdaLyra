name: V18 Independent CI Fixture Acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v18-independent-ci-fixture-acceptance.yml'
      - 'test/test_avatar2d_batch09_foundation.py'
      - 'test/test_comfyui_host.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v18-independent-fixtures-${{ github.sha }}
  cancel-in-progress: false

jobs:
  security-boundary-fixtures:
    name: Avatar registration and ComfyUI ownership on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install production package and pytest
        run: python -m pip install -e . pytest
      - name: Verify guarded avatar and owner-only ComfyUI test cases
        run: >-
          python -m pytest -q
          test/test_avatar2d_batch09_foundation.py
          test/test_comfyui_host.py
          test/test_package_grouping.py
          --junitxml=independent-fixtures-junit.xml
      - name: Retain exact-commit regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: independent-fixtures-${{ matrix.os }}-${{ github.sha }}
          path: independent-fixtures-junit.xml
          if-no-files-found: warn
          retention-days: 30
