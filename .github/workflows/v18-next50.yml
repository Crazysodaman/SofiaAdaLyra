name: V18 Next 50 Review and Objective Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v18-next50-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install current production package and pytest
        run: python -m pip install -e . pytest

      - name: Verify exact 50 reviews and independently checked artifacts
        run: >-
          python -m pytest -q
          test/test_v18_next50_audit.py
          test/test_life_objective_parser_bounded.py
          test/test_v18_phase00_batch.py
          test/test_v18_decision_persistence.py
          test/test_memory_reviewed_corrections.py

      - name: Pin review to checked-out Git revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: >-
          python -m sofia.platform.verify.v18_next50_audit
          --repo .
          --expected-revision "$EXPECTED_SHA"
          --output v18-next50-source-proof.json

      - name: Upload review, not a live host attestation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v18-next50-${{ matrix.os }}-${{ github.sha }}
          path: v18-next50-source-proof.json
          if-no-files-found: warn
          retention-days: 30
