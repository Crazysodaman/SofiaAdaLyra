name: V18 Phase 00 Batch 30 Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v18-phase00-batch30-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-functional-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the existing production package
        run: python -m pip install -e . pytest

      - name: Verify V18 source-preservation guard regression cases
        run: python -m pytest -q test/test_v18_change_guard.py

      - name: Run 30 task source-gate and representative functional regressions
        run: >-
          python -m pytest -q
          test/test_v18_phase00_batch.py
          test/test_life_state_graph_contract.py
          test/test_ws4_model_admission_positive_metrics.py
          test/test_v18_decision_persistence.py
          test/test_v18_settled_response_trace.py
          test/test_v18_phase00_contracts.py
          test/test_v18_companion_baseline.py
          test/test_cognition_v2_turn_kernel.py
          test/test_safe_permissions.py
          test/test_distributed_identity_durable.py
          test/test_ops_workshop_vm_separation.py
          test/test_memory_reviewed_corrections.py

      - name: Audit canonical first 30 against exact checked-out Git revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: >-
          python -m sofia.platform.verify.v18_phase00_audit
          --repo .
          --expected-revision "$EXPECTED_SHA"
          --output v18-phase00-batch30-source-proof.json

      - name: Publish source audit proof without claiming live acceptance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v18-phase00-batch30-${{ matrix.os }}-${{ github.sha }}
          path: v18-phase00-batch30-source-proof.json
          if-no-files-found: warn
          retention-days: 30
