name: V18 Phase 00 All 65 Source and Retrieval
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v18-phase00-full-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-contract-and-bounded-context:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install production source
        run: python -m pip install -e . pytest
      - name: Run phase-wide source gate and real bounded-retrieval regressions
        run: >-
          python -m pytest -q
          test/test_v18_phase00_full.py
          test/test_v18_acceptance_matrix.py
          test/test_v18_phase00_model_outage.py
          test/test_conversation_continuity_acceptance.py
          test/test_environment_runtime_projection.py
          test/test_v18_owner_tool_result_authority.py
          test/test_cognitive_context_assembler.py
          test/test_memory_runtime_wiring.py
          test/test_v18_phase00_contracts.py
          test/test_v18_companion_baseline.py
          test/test_v18_gate4.py
          test/test_v18_dependency_queue.py
      - name: Publish exact-revision Phase 00 evidence, not production acceptance
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: >-
          python -m sofia.verify.v18_phase00_full
          --repo .
          --expected-revision "$EXPECTED_SHA"
          --output v18-phase00-all65.json
          --markdown-output v18-phase00-all65.md
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v18-phase00-all65-${{ matrix.os }}-${{ github.sha }}
          path: |
            v18-phase00-all65.json
            v18-phase00-all65.md
          if-no-files-found: warn
          retention-days: 30
