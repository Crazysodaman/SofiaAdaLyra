name: V18 Phase 03-04 focused verification

on:
  push:
    branches: [main]
    paths:
      - 'scripts/verify_sofia_portable_export.py'
      - 'src/sofia/ops/recovery_export.py'
      - 'src/sofia/ops/backup*.py'
      - 'src/sofia/mobile/**'
      - 'mobile/android/**'
      - 'test/test_ws2_portable_export_validator.py'
      - 'test/test_ops_backup_topology.py'
      - 'test/test_ops_backup_topology.py'
      - 'test/test_mobile_*.py'
      - '.github/workflows/v18-phase03-04-gate4.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase03-04-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recovery-and-mobile:
    name: ${{ matrix.os }} / recovery and mobile contract
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install distribution and pytest
        run: python -m pip install . pytest
      - name: Run scoped recovery and mobile failure regressions
        run: >-
          python -m pytest -q
          test/test_ws2_portable_export_validator.py
          test/test_recovery_portable_verifier.py
          test/test_recovery_portable_conversations.py
          test/test_ops_backup_topology.py
          test/test_mobile_admission_sequence.py
          test/test_mobile_delivery_status_reconciliation.py
          test/test_mobile_notifications.py
          test/test_ws2_mobile_notification_epoch_fence.py

  android-keystore:
    name: Android encrypted inbox instrumentation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable emulator acceleration
        run: |
          sudo sh -c 'echo KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm" > /etc/udev/rules.d/99-kvm4all.rules'
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          working-directory: mobile/android
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon
