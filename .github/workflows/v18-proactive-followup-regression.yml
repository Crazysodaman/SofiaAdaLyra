name: V18 Proactive Follow-up Regression
on:
  push:
    branches: [main]
    paths:
      - 'src/sofia/platform/application/presence.py'
      - 'src/sofia/platform/application/act_service.py'
      - 'src/sofia/platform/application/background_runtime.py'
      - 'src/sofia/platform/application/conversation_service.py'
      - 'src/sofia/ui/desktop.py'
      - 'test/test_presence_initiative.py'
      - 'test/test_act_runtime_wiring.py'
      - 'test/test_conversation_service.py'
      - 'test/test_ui_desktop.py'
      - 'test/conftest.py'
      - '.github/workflows/v18-proactive-followup-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-regression:
    name: Proactive/ACT/UI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tested Sofía package
        run: python -m pip install -e . pytest
      - name: Run follow-up, ACT, UI and package-owner regressions
        run: >-
          python -m pytest -q
          test/test_presence_initiative.py
          test/test_act_runtime_wiring.py
          test/test_ui_desktop.py
          test/test_conversation_service.py
          test/test_package_grouping.py
