name: V18 Stage 3 CA and ML Integration Acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v18-stage3-ca-ml-integration.yml'
      - 'src/sofia/core/life/**'
      - 'src/sofia/core/learning/**'
      - 'src/sofia/platform/distributed/**'
      - 'src/sofia/core/memory/**'
      - 'test/test_life_*.py'
      - 'test/test_distributed_capability_lifecycle.py'
      - 'test/test_memory_review_source_revalidation.py'
      - 'test/test_v18_phase00_model_outage.py'
  workflow_dispatch:

permissions:
  contents: read

# Exact-commit tests should survive unrelated creative/GA main pushes.
concurrency:
  group: v18-stage3-ca-ml-integration-${{ github.sha }}
  cancel-in-progress: false

jobs:
  cross-owner-regressions:
    name: ${{ matrix.cohort }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        cohort: [life-recovery, distributed-memory]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install existing production package and pytest
        run: python -m pip install -e . pytest
      - name: Verify CA LIFE recovery, milestones and objective settlement
        if: matrix.cohort == 'life-recovery'
        shell: bash
        run: >-
          python -m pytest -q
          test/test_v18_phase00_model_outage.py
          test/test_life_verified_milestone_production.py
          test/test_life_postrun_verification.py
          test/test_life_project_forge.py
          test/test_life_strict_model_json.py
          test/test_life_goal_run_resume_fence.py
          test/test_life_no_placeholder_autonomous_authoring.py
          --junitxml=stage3-life-recovery.xml 2>&1
          | tee "$RUNNER_TEMP/stage3-life-recovery-output.log"
      - name: Publish Phase 3 LIFE cohort failure annotation
        if: failure() && matrix.cohort == 'life-recovery'
        shell: bash
        run: |
          tail -n 80 "$RUNNER_TEMP/stage3-life-recovery-output.log" \
            | while IFS= read -r line; do
                printf '%s\n' "::error title=stage3-life-recovery pytest failure::$line"
              done
      - name: Verify ML/CA transport, memory provenance and safety
        if: matrix.cohort == 'distributed-memory'
        shell: bash
        run: >-
          python -m pytest -q
          test/test_distributed_capability_lifecycle.py
          test/test_ops_activity_capability.py
          test/test_memory_review_source_revalidation.py
          test/test_remote_mtls_transport_acceptance.py
          test/test_evolve_training_holdout_separation.py
          test/test_v18_phase00_contracts.py
          --junitxml=stage3-distributed-memory.xml 2>&1
          | tee "$RUNNER_TEMP/stage3-distributed-memory-output.log"
      - name: Publish Phase 3 distributed-memory cohort failure annotation
        if: failure() && matrix.cohort == 'distributed-memory'
        shell: bash
        run: |
          tail -n 80 "$RUNNER_TEMP/stage3-distributed-memory-output.log" \
            | while IFS= read -r line; do
                printf '%s\n' "::error title=stage3-distributed-memory pytest failure::$line"
              done
      - name: Publish exact-revision JUnit receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage3-${{ matrix.cohort }}-${{ matrix.os }}-${{ github.sha }}
          path: stage3-*.xml
          if-no-files-found: warn
          retention-days: 30
