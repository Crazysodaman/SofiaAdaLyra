name: V18 Stage 3 GA Acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v18-stage3-ga-acceptance.yml'
      - 'src/sofia/generalization/**'
      - 'test/test_generalization_*.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v18-stage3-ga-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ga-stage3-production-regressions:
    name: GA-014/017/019/034 on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install existing production package and pytest
        run: python -m pip install -e . pytest
      - name: Run focused production and security regressions for GA Stage 3
        run: >-
          python -m pytest -q
          test/test_generalization_workflow.py
          test/test_generalization_skills.py
          test/test_generalization_advanced.py
          test/test_generalization_foundation.py
          --junitxml=ga-stage3-junit.xml
      - name: Publish exact-revision test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ga-stage3-${{ matrix.os }}-${{ github.sha }}
          path: ga-stage3-junit.xml
          if-no-files-found: warn
          retention-days: 30
