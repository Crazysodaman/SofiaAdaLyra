name: V18 Stage 3 ML and CA Regression Acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v18-stage3-ml-ca-acceptance.yml'
      - 'src/sofia/learning/**'
      - 'src/sofia/memory/ranking.py'
      - 'src/sofia/life/**'
      - 'src/sofia/platform.application/presence.py'
  workflow_dispatch:

permissions:
  contents: read

# Keep exact-revision acceptance jobs: parallel Codex commits must not cancel
# evidence for a previously checked-out tree.
concurrency:
  group: v18-stage3-ml-ca-${{ github.sha }}
  cancel-in-progress: false

jobs:
  production-regressions:
    name: ${{ matrix.cohort }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        cohort: [learning, life]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install production package and pytest
        run: python -m pip install -e . pytest
      - name: Run learning foundation, Fleet, memory and outreach regressions
        if: matrix.cohort == 'learning'
        run: >-
          python -m pytest -q
          test/test_learning_foundation.py
          test/test_learning_fleet_pressure.py
          test/test_ops_latency.py
          test/test_memory_explicit_ranking.py
          test/test_memory_reviewed_corrections.py
          test/test_presence_initiative.py
          --junitxml=stage3-learning-junit.xml
      - name: Run LIFE, RUN, objective oracle and NEURO regressions
        if: matrix.cohort == 'life'
        run: >-
          python -m pytest -q
          test/test_life_structured_critique.py
          test/test_life_atomic_admission.py
          test/test_life_run_outcome_reconciliation.py
          test/test_v18_success_oracle_contract.py
          test/test_neuro_association_production.py
          test/test_life_state_graph_contract.py
          test/test_life_operator_diagnostics.py
          --junitxml=stage3-life-junit.xml
      - name: Publish task-scoped results (not real-host acceptance)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v18-stage3-${{ matrix.cohort }}-${{ matrix.os }}-${{ github.sha }}
          path: stage3-*-junit.xml
          if-no-files-found: warn
          retention-days: 30
