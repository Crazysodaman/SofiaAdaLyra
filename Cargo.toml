[workspace]
members = ["rust/crates/sofia-contracts", "rust/crates/sofia-core-link", "rust/crates/sofia-ui-broker", "rust/crates/sofia-platform-lifecycle"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88.0"
license = "LicenseRef-Proprietary"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
