[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sofia-ada-lyra"
version = "0.1.0"
description = "Sofía Ada Lyra"
requires-python = ">=3.12"
dependencies = [
    "ollama",
    "discord.py==2.7.1",
    "pypdf",
    "cryptography",
    "tzdata",
    "pywin32>=311; sys_platform == \"win32\"",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sofia.ui" = ["assets/*.ico"]

[tool.pytest.ini_options]
python_classes = ["*Test"]
pythonpath = [".", "src"]
markers = [
    "integration: tests requiring external services",
    "cross_package: test intentionally spans more than one package boundary",
    "pkg_core: PKG-CORE cognition, identity, continuity, configuration and runtime",
    "pkg_interact: PKG-INTERACT text/avatar interaction semantics and boundaries",
    "pkg_mem: PKG-MEM durable memory, provenance and reviewed retrieval",
    "pkg_social: PKG-SOCIAL principals, audiences and isolation",
    "pkg_net: PKG-NET networking, distributed transport and remote trust",
    "pkg_ui: PKG-UI clients, Discord transport and desktop/workbench surfaces",
    "pkg_voice: PKG-VOICE speech input/output, runtime capability and prosody",
    "pkg_run: PKG-RUN lifecycle, supervision, heartbeat and periodic work",
    "pkg_ops: PKG-OPS fleet, machine, telemetry and maintenance operations",
    "pkg_act: PKG-ACT actions, goals, delivery and proactive outreach",
    "pkg_rel: PKG-REL relationship continuity",
    "pkg_avatar: PKG-AVATAR embodiment, presentation and wardrobe",
    "pkg_dev: PKG-DEV engineering, codebase and filesystem development tooling",
    "pkg_body: PKG-BODY robotics and physical embodiment",
    "pkg_evolve: PKG-EVOLVE governed revisions and amendments",
    "pkg_clean: PKG-CLEAN repository/runtime cleanup",
    "pkg_know: PKG-KNOW documents, reference knowledge and provenance",
    "pkg_integrate: PKG-INTEGRATE typed service/application adapters",
    "pkg_environment: PKG-ENVIRONMENT time, location, season, weather and ambient context",
    "pkg_habit: PKG-HABIT observations, patterns, expectations and learning controls",
    "pkg_safe: PKG-SAFE authority, security, privacy, recovery and protected execution",
    "pkg_verify: PKG-VERIFY evidence, acceptance and verification infrastructure",
]
