[package]
name = "sofia-core-link"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Read-only, enrolled mTLS client for the Sofía Core Link wire protocol"
publish = false

[features]
# Explicit opt-in for the disposable mTLS compatibility executable only.
diagnostic-probe = []

[[bin]]
name = "r2_core_link_probe"
path = "src/bin/r2_core_link_probe.rs"
required-features = ["diagnostic-probe"]

[[bin]]
name = "r2_platform_status_probe"
path = "src/bin/r2_platform_status_probe.rs"
required-features = ["diagnostic-probe"]

[dependencies]
chrono = { version = "=0.4.40", default-features = false, features = ["std", "clock"] }
regex = "=1.11.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls-manual-roots"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.8"
thiserror = "=2.0.12"
x509-parser = "=0.16.0"

[lints]
workspace = true
