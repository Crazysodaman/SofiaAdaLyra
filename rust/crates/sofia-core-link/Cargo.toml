[package]
name = "sofia-core-link"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Read-only, enrolled mTLS client for the Sofía Core Link wire protocol"
publish = false

[dependencies]
chrono = { version = "=0.4.40", default-features = false, features = ["std", "clock"] }
regex = "=1.11.1"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "=2.2.0"
serde = { version = "=1.0.219", default-features = false, features = ["std"] }
serde_json = "=1.0.140"
sha2 = "=0.10.8"
thiserror = "=2.0.12"
url = "=2.5.4"

[lints]
workspace = true
