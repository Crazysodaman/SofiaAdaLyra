[package]
name = "sofia-ui-broker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Authority-free R3-R5 UI broker policy and contract foundation"
publish = false

[features]
default = []
desktop = ["dep:eframe"]

[[bin]]
name = "aegis-control-center"
path = "src/bin/aegis_control_center.rs"
required-features = ["desktop"]

[[bin]]
name = "sofia-desktop"
path = "src/bin/sofia_desktop.rs"
required-features = ["desktop"]

[dependencies]
eframe = { version = "=0.31.1", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
chrono = { version = "=0.4.40", default-features = false, features = ["std", "clock"] }
fs2 = "=0.4.3"
getrandom = "=0.2.17"
sofia-contracts = { path = "../sofia-contracts" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.8"

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
interprocess = "=2.2.3"
atomicwrites = "=0.4.4"
winapi-util = "=0.1.11"
windows-permissions = "=0.2.4"
winsafe = { version = "=0.0.29", features = ["advapi"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "=0.29.0", features = ["socket"] }

[dev-dependencies]
tempfile = "=3.27.0"
